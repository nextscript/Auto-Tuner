display_name: "Kolibri 1 78B-A3.5B (Aleph Alpha)"
patterns:
  - kolibri-1
  - kolibri_1
  - kolibri1
arch_fallback:
  - kolibri1

# Mainline llama.cpp lädt kolibri1 seit b11709 (PR #30673). Davor nur der
# Patch aus Hob-forge/Kolibri-1-GGUF bzw. das hob-llama.cpp-Release
# hob-b11434 (meldet b11434). Deshalb bleibt die Prüfung auf dem
# Architektur-String in der llama-Bibliothek statt eines Build-Bodens: beide
# Runtimes enthalten ihn, Mainline vor b11709 nicht.
required_runtime_markers:
  - kolibri1

max_context: 262144
recommended_kv_quant: q8_0

# general.sampling.* im GGUF und Konverter-README: temp 1.0, top_p 0.97,
# top_k 128.
sampling:
  chat:
    temperature: 1.0
    top_k: 128
    top_p: 0.97
    min_p: 0.0
    repeat_penalty: 1.0
  coding:
    temperature: 1.0
    top_k: 128
    top_p: 0.97
    min_p: 0.0
    repeat_penalty: 1.0

extra_args:
  - --jinja

notes: >
  Aleph Alpha Kolibri 1: a 78B-total/3.5B-active MoE reasoning model for
  German and English (kolibri1 architecture, 384 experts with 6 active plus
  a shared expert, sliding-window attention, 262,144 tokens of context).
  Mainline llama.cpp loads it since b11709 (PR #30673); the hob-llama.cpp
  release hob-b11434 still works as well. GGUFs made with the earlier hob
  patch store the pre-tokenizer "kolibri1" and gating type 5, which mainline
  does not know; on mainline AutoTuner maps them to the equivalent qwen2
  pre-tokenizer and sigmoid gating with --override-kv. Measured on b12187
  (Q4_K_M, both GPUs plus CPU experts): 67 tok/s on Vulkan, 63 on HIP.
  Reasoning effort none/low/medium/high is set through the chat template;
  sampling from the GGUF: temperature 1.0, top-p 0.97, top-k 128.
