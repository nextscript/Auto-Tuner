display_name: "Raon-1 Nano (KRAFTON)"
patterns:
  - raon-1-nano
  - raon_1_nano
  - raon1nano
  - raon1-nano
arch_fallback:
  - raon1nano
arch_authoritative: true

# Upstream llama.cpp PR #32200 ("model : add Raon-1-nano support") is still
# open as of b12811 (only Raon-1 Mini / raon1 landed in b12758, PR #32176).
# Mainline b12811 aborts with "unknown model architecture: 'raon1nano'".
# Gate on the raon1nano runtime marker so KRAFTON's fork or a future mainline
# merge unlocks automatically without passing on raon1-only mainline builds.
required_runtime_markers:
  - raon1nano

max_context: 262144
recommended_kv_quant: q8_0

# KRAFTON Raon-1 card defaults (same chat vs coding/agentic split as Raon-1 Mini).
sampling:
  chat:
    temperature: 0.1
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 1.5
  coding:
    temperature: 1.0
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0

extra_args:
  - --jinja

notes: >
  KRAFTON Raon-1 Nano (raon1nano, 3.1B total / 1.5B effective dense hybrid
  RDA + gated MLA with Raon-mHC, per-layer embeddings, and optional MTP,
  262,144 context). Mainline llama.cpp through b12811 loads only Raon-1 Mini
  (raon1, b12758) and still lacks raon1nano (upstream PR #32200 is open).
  AutoTuner checks specifically for the raon1nano runtime marker so KRAFTON's
  fork (krafton-ai/llama.cpp) or a future mainline merge passes while current
  mainline is refused pre-launch. Sampling follows KRAFTON's card (chat:
  temp 0.1, presence penalty 1.5; coding/agentic: temp 1.0, top-k 20,
  top-p 0.95, presence penalty 0.0).
