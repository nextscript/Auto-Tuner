display_name: "Domyn Edge 4B (Domyn)"
patterns:
  - domyn-edge
  - domyn_edge
  - domynedge
arch_fallback:
  - domynedge
arch_authoritative: true

# Architecture domynedge landed in b12568 (PR #32559): 4B dense transformer
# with sandwich RMSNorm, interleaved sliding-window/full attention, toggleable
# <think> reasoning and agentic tool use. Trained to 1M, recommended 256K.
min_llama_build: 12568
max_context: 262144
recommended_kv_quant: q8_0

sampling:
  chat:
    temperature: 1.0
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
  coding:
    temperature: 0.7
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0

extra_args:
  - --jinja

notes: >
  Domyn Edge 4B: dense agentic coding and reasoning model (domynedge
  architecture, sandwich RMSNorm, sliding-window and full attention) with
  262,144 recommended context (up to 1M native). Needs llama.cpp b12568+
  (PR #32559). Supports toggleable <think> reasoning and multi-turn tool
  calling via --jinja. Sampling follows the model card (temperature 1.0,
  top-p 0.95, top-k 20; lower temperature 0.7 for coding).
