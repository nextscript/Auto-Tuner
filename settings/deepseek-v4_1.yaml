display_name: "DeepSeek-V4.1-Flash"
patterns:
  - deepseek-v4.1
  - deepseek_v4.1
  - deepseekv4.1
  - deepseek-v4_1
  - deepseek_v4_1
  - deepseekv4_1
  - deepseek-v41
  - deepseek_v41
  - deepseekv41
  - deepseek41

arch_fallback:
  - deepseek41
arch_authoritative: true

# Mainline-Loader seit b11870 (PR #31086): Architektur deepseek41 mit eigenem
# DSv4-KV-Cache (CSA2 Full/Reindex/Reuse), Engram-Tabelle, Bild-Projektor
# deepseek41v und eigenem Chat-Renderer. Kein MTP-Graph: der DSpark-Draft ist
# eine separate DFLASH-GGUF (--spec-type draft-dspark). Dateien aus dem
# reinen Konvertierungs-PR #28696 (deepseek_v41*, deepseek4 + Engram-Keys)
# sperrt tuner._model_runtime_block_reason weiterhin.
min_llama_build: 11870

max_context: 1048576
recommended_kv_quant: q8_0
performance_target: throughput

# Modellkarte: temperature 1.0, top_p 0.95 (1.0 ebenfalls zulässig).
sampling:
  chat:
    temperature: 1.0
    top_k: 0
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0
  coding:
    temperature: 1.0
    top_k: 0
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0

extra_args:
  - --jinja

notes: >
  DeepSeek-V4.1-Flash: a multimodal 552B-backbone Causal Encoder-Decoder MoE
  (deepseek41 architecture: CSA2 attention that shares KV across layers,
  Engram conditional memory, single-pass mHC) with up to 1,048,576 tokens of
  context. Mainline llama.cpp runs it since b11870 (PR #31086), including
  image input through the deepseek41v mmproj and its own chat formatting.
  There is no in-file MTP head; DSpark speculation uses a separate DFLASH
  draft GGUF (draft-dspark). AutoTuner budgets KV for every layer, which
  overestimates the shared CSA2 cache; the plan has not been measured on a
  real V4.1 GGUF. GGUFs from the earlier conversion-only PR #28696 are
  refused. Sampling from the model card: temperature 1.0, top-p 0.95;
  reasoning effort runs from 1 to 100.
