display_name: "Decision models (TypeSafe /v1/systemone)"
patterns:
  - openjev
  - laya-
  - julia-1
  - kev-4b
  - lev-q
  - lev-bf16
  - lev-f16
  - bespoke-nimble
  - nimble-9b
  # Perplexity pplx-decider (qwen35 backbone, b11447+) and LiquidAI d1
  # (lfm2 backbone, d1-3B b11483+, d1-omni-600M b11488+). Their per-type
  # floors are checked from <arch>.decision.type in tuner.check_model_build.
  - pplx-decider
  - d1-3b
  - d1-2b
  - d1-omni
  # b11773 (PR #30361) H2O-Lightning-4B, b11928 (PR #30980) MiniCPM-OCR-Jev,
  # b11945 (PR #31275) LiquidAI d1-2B / d1-omni-2B (decision types lfm3-d1*).
  - h2o-lightning
  - minicpm-ocr-jev
  # b11571/b11572 (PRs #30378/#30383): vLLM Decision 2 and D3. The vllm-sr
  # "Decision-2.0-*" GGUFs are a fork format (decision type decision2);
  # tuner.check_model_build names the fork they need.
  - vllm-decision2
  - vllm-d3
  - decision-2.0
  - decision-2_0
arch_fallback:
  - vllm-decision2

# llama.cpp b11361 (PR #29818) serves openjev, lev, laya, julia-1 and kev
# through POST /v1/systemone; b11364 (PR #29844) adds nimble. The floor is the
# newer tag so one profile covers the whole family.
min_llama_build: 11364

# Questions and state are short classification prompts, not chat history.
# laya/julia-1 are ModernBERT encoders with 8192 native context; the Qwen/Gemma
# based heads inherit a 262k window they never need.
max_context: 32768
recommended_kv_quant: q8_0
draft_max: 0

# Formal only: a decision is one forward pass, no token is sampled.
sampling:
  chat:
    temperature: 0.0
    top_k: 1
    top_p: 1.0
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0
  coding:
    temperature: 0.0
    top_k: 1
    top_p: 1.0
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0

notes: >
  TypeSafe-style decision models (OpenJev, lev, Laya, Julia-1, Kev, Nimble,
  Perplexity pplx-decider, LiquidAI d1-3B, d1-2B, d1-omni-600M and
  d1-omni-2B, vLLM Decision 2 and D3, H2O-Lightning-4B, MiniCPM-OCR-Jev):
  they answer typed
  choice/score/noul questions about a state in one forward pass through POST
  /v1/systemone and generate no text, so chat, sampling, reasoning and
  speculation settings have no effect. Needs llama.cpp b11364+ (b11361 for
  all but Nimble); AutoTuner reads the GGUF's decision type and requires
  b11447+ for pplx-decider, b11483+ for d1-3B, b11488+ for d1-omni-600M,
  b11571+ for vllm-decision2, b11577+ for vllm-d3, b11773+ for H2O-Lightning-4B,
  b11928+ for MiniCPM-OCR-Jev and b11945+ for LiquidAI d1-2B and d1-omni-2B
  (Granite Switch 4.1, a chat model with a decision adapter, needs b11707+).
  The vllm-sr
  Decision-2.0 GGUFs use the fork-only type decision2, which mainline
  rejects; AutoTuner names the fork they need.
  The encoder variants (Laya, Julia-1, d1-omni-600M, vLLM Decision 2 and D3)
  must fit the whole prompt
  into one physical batch, which AutoTuner sizes for up to 8192 tokens.
  OpenJev, pplx-decider and the d1 models accept images when their mmproj is
  attached (d1-omni-600M also audio). Probabilities use the temperatures
  stored in the GGUF and are not guaranteed to be calibrated for your data.
  The prompt cache stays off, as in llama.cpp b11642+: decision states
  seldom repeat.
